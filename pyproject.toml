[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-detection-autoencoders"
version = "0.1.0"
description = "Unsupervised multivariate time-series anomaly detection with LSTM and TCN autoencoders."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Gaurav Kumar"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "torch>=2.2,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
anomaly-detection = "anomaly_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
